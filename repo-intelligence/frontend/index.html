<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Repo Intelligence</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙 Dark</button>
  <div class="container">
    <div class="hero">
      <h1>Repo Intelligence</h1>
      <p>Transform any public GitHub repository into an investor-ready report in minutes.</p>
    </div>

    <div class="input-row">
      <input type="text" id="repoUrl" placeholder="https://github.com/owner/repository" />
      <button onclick="analyzeRepo()">Analyze</button>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="status-bar" id="statusBar">
      <div class="spinner"></div>
      <span id="statusText">Fetching repository data...</span>
    </div>

    <div class="report" id="report">
      <div class="score-banner" id="scoreBanner"></div>
      <div class="metrics-grid" id="metricsGrid"></div>
      <div class="two-col">
        <div class="section-card" id="codeQualityCard"></div>
        <div class="section-card" id="securityCard"></div>
      </div>
      <div class="section-card" id="aiInsightsCard"></div>
      <div class="section-card" id="techStackCard"></div>
      <div class="section-card" id="investorSummaryCard"></div>
      <div class="actions-row">
        <button onclick="downloadPDF()">Download PDF</button>
        <button onclick="resetTool()">Analyze Another</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
